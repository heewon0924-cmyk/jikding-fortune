name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - name: 스모크 테스트 (키 없는 데모 모드)
        run: |
          PORT=3000 node server.js &
          for i in $(seq 1 10); do curl -fsS localhost:3000/api/health && break; sleep 1; done
          curl -fsS localhost:3000/ | grep -q '오늘의 운세 뽑기'
          R=$(curl -fsS -X POST -H 'content-type: application/json' -d '{"name":"CI"}' localhost:3000/api/fortune)
          ID=$(echo "$R" | node -pe 'const r=JSON.parse(require("fs").readFileSync(0)); if(!r.fortune||!r.image) process.exit(1); r.id')
          curl -fsS "localhost:3000/api/fortune/$ID" >/dev/null
          echo "OK: $ID"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: 서버 시크릿이 없으면 배포 건너뛰기
        if: env.SSH_HOST == ''
        run: echo "::notice::SSH_HOST/SSH_USER/SSH_KEY 시크릿을 설정하면 main 푸시 때 자동 배포됩니다."
      - name: SSH 로 deploy.sh 실행
        if: env.SSH_HOST != ''
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            'sudo /opt/jikding-fortune/deploy/deploy.sh'
