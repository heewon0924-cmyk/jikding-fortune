# 말그미 기본 사이트. 앞으로 만드는 앱은 이 server 블록 안에 location 으로 붙인다.
# setup-server.sh 가 __DOMAIN__ 을 채워 /etc/nginx/sites-available/malgeumi 에 설치한다.
# HTTPS 는 설치 후 certbot --nginx -d __DOMAIN__ 이 이 파일에 443 블록을 추가한다.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    charset utf-8;

    # 첫 화면이 생기기 전까지는 운세로 보낸다
    location = / {
        return 302 /fortune/;
    }

    # ── 운세 (malgeumi 서비스, 127.0.0.1:3000) ──
    location = /fortune {
        return 301 /fortune/;
    }
    location ^~ /fortune/ {
        # 끝의 / 가 /fortune 접두어를 떼고 앱에 넘긴다 (/fortune/api/x → /api/x)
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
}
