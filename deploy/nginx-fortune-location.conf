# 이미 돌고 있는 사이트(예: /etc/nginx/sites-available/island)에 운세 앱을 /fortune/ 경로로 붙인다.
# 그 파일의 server { ... } 블록 안, location / 위쪽에 붙여 넣고:
#   sudo nginx -t && sudo systemctl reload nginx
# → https://기존주소/fortune/

location = /fortune {
    return 301 /fortune/;
}

# ^~ : 기존 사이트의 정규식 규칙(location ~* \.(html|js|css|svg)$ 등)이
#      /fortune/ 아래를 가로채지 않게 이 블록을 우선한다
location ^~ /fortune/ {
    # 끝의 / 가 /fortune 접두어를 떼고 앱에 넘긴다 (/fortune/api/x → /api/x)
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AI 이미지 생성은 10~40초 걸릴 수 있다
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
