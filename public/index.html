<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ec">
<meta name="description" content="가볍게 뽑아 보는 오늘의 운세">
<meta property="og:title" content="오늘의 운세">
<meta property="og:description" content="금전운, 연애운, 행운의 색… 오늘 나의 운세는?">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
<title>오늘의 운세</title>
<style>
  :root {
    --bg: #f4f1ec;
    --card: #ffffff;
    --ink: #2b2a33;
    --muted: #7d7a86;
    --line: #e7e2da;
    --accent: #6c5ce7;
    --accent-soft: #efecff;
    --bar: #6c5ce7;
    --shadow: 0 10px 30px rgba(43, 42, 51, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161c; --card: #22212a; --ink: #ecebf2; --muted: #9a97a6;
      --line: #33313d; --accent: #a59bff; --accent-soft: #2d2a40; --bar: #a59bff;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    min-height: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -.02em; }
  header .date { font-size: 13px; color: var(--muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 24px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  .card.leaving { animation: sink .25s ease both; }
  @keyframes sink { to { opacity: 0; transform: translateY(-10px) rotate(-2deg) scale(.96); } }

  .hidden { display: none !important; }

  /* 초기 화면 */
  .intro { justify-content: center; align-items: center; text-align: center; gap: 18px; }
  .crystal { font-size: 64px; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .intro h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
  .intro p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 16px;
    border-radius: 16px; padding: 15px 18px;
    transition: transform .08s ease, opacity .2s;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; max-width: 260px; }
  @media (prefers-color-scheme: dark) { .btn-primary { color: #17161c; } }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); }

  /* 로딩 */
  .loading { justify-content: center; align-items: center; gap: 20px; text-align: center; }
  .spinner {
    width: 52px; height: 52px; border-radius: 50%;
    border: 5px solid var(--accent-soft); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 15px; color: var(--muted); min-height: 1.5em; transition: opacity .2s; }

  /* 결과 */
  .result { gap: 16px; padding-top: 20px; flex: none; } /* 내용 높이에 맞춘다 (그림이 없을 때 빈칸 방지) */
  .art {
    width: 100%; aspect-ratio: 1 / 1; border-radius: 18px; overflow: hidden;
    background: var(--accent-soft); display: grid; place-items: center;
  }
  .art { position: relative; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .title { margin: 0; font-size: 19px; letter-spacing: -.03em; }
  .fortune { margin: 0; font-size: 16px; line-height: 1.65; word-break: keep-all; }
  .indices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .idx-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .idx-head b { font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--bar); border-radius: inherit; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .lucky { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .lucky div { background: var(--accent-soft); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .lucky span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .lucky b { font-size: 14px; word-break: keep-all; }
  .advice { margin: 0; font-size: 14px; line-height: 1.5; word-break: keep-all; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 14px; }
  .advice b { color: var(--accent); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }

  .error { color: #d64545; font-size: 14px; text-align: center; margin: 0; }
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 14px;
    transition: .25s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { text-align: center; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>🔮 오늘의 운세</h1>
    <span class="date" id="today"></span>
  </header>

  <!-- 1. 초기 화면 -->
  <section class="card intro" id="view-intro">
    <div class="crystal" aria-hidden="true">🔮</div>
    <h2>오늘 당신의 운은?</h2>
    <p>버튼 한 번이면 AI가<br>오늘의 금전운·연애운과 행운의 색을 알려드립니다.</p>
    <button class="btn btn-primary" id="btn-draw">오늘의 운세 뽑기</button>
    <p class="error hidden" id="error"></p>
  </section>

  <!-- 2. 로딩 -->
  <section class="card loading hidden" id="view-loading" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-text" id="loading-text">운세 출근 중...</div>
  </section>

  <!-- 3. 결과 -->
  <section class="card result hidden" id="view-result">
    <div class="art hidden" id="r-art"><img id="r-img" alt="오늘의 운세 그림"></div>
    <h2 class="title" id="r-title"></h2>
    <p class="fortune" id="r-fortune"></p>
    <div class="indices" id="r-indices"></div>
    <div class="lucky">
      <div><span>행운의 아이템</span><b id="r-lucky"></b></div>
      <div><span>행운의 색</span><b id="r-color"></b></div>
      <div><span>행운의 숫자</span><b id="r-number"></b></div>
    </div>
    <p class="advice"><b>💡 오늘의 조언</b> · <span id="r-advice"></span></p>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-again">🔄 다시 뽑기</button>
      <button class="btn btn-primary" id="btn-share" style="max-width:none">💬 공유하기</button>
    </div>
  </section>

  <footer id="footer">재미로만 봐주세요 · 맞으면 기분 좋고, 틀리면 운세 탓</footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const views = { intro: $('view-intro'), loading: $('view-loading'), result: $('view-result') };

  const LOADING_LINES = [
    '별자리 정렬하는 중...',
    '네잎클로버 세는 중...',
    '행운의 색 섞는 중...',
    '오늘의 기운 충전 중...',
    '수정 구슬 닦는 중...',
    '지갑 사정 엿보는 중...',
    '귀인 위치 탐색 중...',
    '퇴근 시간 계산 중...',
  ];

  let current = null;
  let loadingTimer = null;

  const d = new Date();
  $('today').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;

  // 예전 버전이 저장해 둔 이름을 지운다
  try { localStorage.removeItem('fortune-name'); } catch (_) {}

  function show(name) {
    const visible = Object.values(views).find((v) => !v.classList.contains('hidden'));
    const next = views[name];
    if (visible === next) return;
    const swap = () => {
      Object.values(views).forEach((v) => { v.classList.add('hidden'); v.classList.remove('leaving'); });
      next.classList.remove('hidden', 'leaving');
      // 애니메이션 재시작
      next.style.animation = 'none'; void next.offsetWidth; next.style.animation = '';
    };
    if (visible) {
      visible.classList.add('leaving');
      setTimeout(swap, 220);
    } else swap();
  }

  function startLoadingText() {
    const el = $('loading-text');
    const lines = [...LOADING_LINES].sort(() => Math.random() - 0.5);
    let i = 0;
    el.textContent = lines[0];
    loadingTimer = setInterval(() => {
      i = (i + 1) % lines.length;
      el.style.opacity = 0;
      setTimeout(() => { el.textContent = lines[i]; el.style.opacity = 1; }, 180);
    }, 1400);
  }
  function stopLoadingText() { clearInterval(loadingTimer); loadingTimer = null; }

  function showError(msg) {
    const el = $('error');
    el.textContent = msg;
    el.classList.toggle('hidden', !msg);
  }

  async function draw() {
    showError('');
    $('btn-draw').disabled = true;
    show('loading');
    startLoadingText();
    const minWait = new Promise((r) => setTimeout(r, 1200)); // 로딩 문구를 한 번은 보여준다

    try {
      const res = await fetch('api/fortune', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '운세 서버가 잠시 자리를 비웠어요.');
      await Promise.all([minWait, preload(data.image)]);
      render(data);
      history.replaceState(null, '', `?id=${encodeURIComponent(data.id)}`);
    } catch (e) {
      await minWait;
      show('intro');
      showError(e.message === 'Failed to fetch' ? '네트워크 연결을 확인해주세요.' : e.message);
    } finally {
      stopLoadingText();
      $('btn-draw').disabled = false;
    }
  }

  function preload(src) {
    if (!src) return Promise.resolve();
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = img.onerror = resolve;
      img.src = src;
    });
  }

  function render(data) {
    current = data;
    $('r-art').classList.toggle('hidden', !data.image);
    if (data.image) $('r-img').src = data.image;
    $('r-title').textContent = data.title;
    $('r-fortune').textContent = data.fortune;
    $('r-lucky').textContent = data.luckyItem;
    $('r-color').textContent = data.luckyColor || '-';
    $('r-number').textContent = data.luckyNumber ?? '-';
    $('r-advice').textContent = data.advice || '';
    $('r-advice').parentElement.classList.toggle('hidden', !data.advice);

    const box = $('r-indices');
    box.innerHTML = '';
    data.indices.forEach((idx) => {
      const row = document.createElement('div');
      row.innerHTML = '<div class="idx-head"><span></span><b></b></div><div class="bar"><i></i></div>';
      row.querySelector('span').textContent = idx.label;
      row.querySelector('b').textContent = `${idx.value}%`;
      box.appendChild(row);
      requestAnimationFrame(() => setTimeout(() => { row.querySelector('i').style.width = `${idx.value}%`; }, 250));
    });
    show('result');
  }

  function again() {
    history.replaceState(null, '', location.pathname);
    current = null;
    show('intro');
  }

  function shareText(data) {
    const lines = [
      `🔮 오늘의 운세 — ${data.title}`,
      data.fortune,
      data.indices.map((i) => `· ${i.label} ${i.value}%`).join('\n'),
      `🍀 행운의 아이템 ${data.luckyItem} · 색 ${data.luckyColor} · 숫자 ${data.luckyNumber}`,
      data.advice ? `💡 ${data.advice}` : '',
    ];
    return lines.filter(Boolean).join('\n');
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }
    // HTTP 접속 등 clipboard API 를 못 쓰는 환경용
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (!ok) throw new Error('copy failed');
  }

  // 카카오톡 공유: 서버에 KAKAO_JS_KEY 가 있을 때만 SDK 를 불러온다.
  // 카카오톡 안의 브라우저처럼 공유 창이 없는 곳에서도 카톡 친구 선택 화면을 바로 띄울 수 있다.
  let kakaoReady = false;
  async function setupKakao() {
    try {
      const { kakao } = await (await fetch('api/config')).json();
      if (!kakao) return;
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = kakao.sdkUrl;
        if (kakao.integrity) { s.integrity = kakao.integrity; s.crossOrigin = 'anonymous'; }
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      if (!window.Kakao.isInitialized()) window.Kakao.init(kakao.key);
      kakaoReady = true;
    } catch (e) {
      console.warn('카카오 SDK 를 못 불러와서 공유 창/복사로 동작합니다', e);
    }
  }

  // 카카오톡 텍스트 카드는 200자까지라 핵심만 담는다
  function kakaoText(data) {
    const t = [`🔮 오늘의 운세 — ${data.title}`, data.fortune, `🍀 ${data.luckyItem} · ${data.luckyColor} · ${data.luckyNumber}`].join('\n');
    return t.length > 200 ? `${t.slice(0, 199)}…` : t;
  }

  // 순서: 카카오톡 공유 → 휴대폰 공유 창 → 복사.
  // 공유 창은 HTTPS 에서만, 카카오톡 공유는 카카오에 등록한 도메인에서만 동작한다.
  async function share() {
    if (!current) return;
    const url = `${location.origin}${location.pathname}?id=${encodeURIComponent(current.id)}`;
    const text = shareText(current);
    if (kakaoReady) {
      try {
        window.Kakao.Share.sendDefault({
          objectType: 'text',
          text: kakaoText(current),
          link: { mobileWebUrl: url, webUrl: url },
          buttonTitle: '나도 뽑기',
        });
        return;
      } catch (e) {
        console.warn('카카오톡 공유 실패, 다른 방법으로 넘어갑니다', e);
      }
    }
    if (navigator.share) {
      try {
        await navigator.share({ title: '오늘의 운세', text: `${text}\n\n👉 나도 뽑기`, url });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return; // 사용자가 공유 창을 닫음
      }
    }
    try {
      await copyText(`${text}\n\n👉 나도 뽑기: ${url}`);
      toast('복사 완료! 카톡방에 붙여넣으세요 ✨');
    } catch (_) {
      toast('복사에 실패했어요. 화면을 캡처해주세요 🙏');
    }
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // 공유 링크(?id=...)로 들어오면 그 결과를 보여준다
  async function loadShared() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) return;
    try {
      const res = await fetch(`api/fortune/${encodeURIComponent(id)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      await preload(data.image);
      render(data);
    } catch (e) {
      history.replaceState(null, '', location.pathname);
      showError(e.message || '공유된 운세를 찾지 못했어요.');
    }
  }

  $('btn-draw').addEventListener('click', draw);
  $('btn-again').addEventListener('click', again);
  $('btn-share').addEventListener('click', share);

  loadShared();
  setupKakao();
})();
</script>
</body>
</html>
